<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Bangladesh Biggest Platform</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    color: #222;
}

.header {
    background: #0b1f3a;
    color: white;
    text-align: center;
    padding: 25px 15px;
}

.header h1 {
    font-size: 28px;
}

.header p {
    margin-top: 8px;
    color: #dbe7f5;
}

.container {
    max-width: 450px;
    margin: 60px auto;
    padding: 20px;
}

.login-box {
    background: white;
    padding: 35px;
    border-radius: 14px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.login-box h2 {
    text-align: center;
    color: #0b1f3a;
    margin-bottom: 25px;
}.login-box label {
    display: block;
    margin-bottom: 7px;
    color: #333;
    font-weight: bold;
}

.login-box input {
    width: 100%;
    padding: 13px;
    margin-bottom: 18px;
    border: 1px solid #d5dbe3;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
}

.login-box input:focus {
    border-color: #0b1f3a;
}

.login-button {
    width: 100%;
    padding: 13px;
    background: #0b1f3a;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

.login-button:hover {
    background: #16365f;
}
</style>
</head>

<body>

<header class="header">
    <h1>Bangladesh Biggest Platform</h1>
    <p>Login to your account</p>
</header>

<div class="container">

    <div class="login-box">

        <h2>Login</h2>        <form onsubmit="loginUser(event)">

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit" class="login-button">
                Login
            </button>

        </form>

        <p id="loginMessage"
           style="text-align:center; margin-top:18px; color:#0b1f3a;">
        </p>    </div>

</div>

<script>

function loginUser(event) {

    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const message = document.getElementById("loginMessage");

    if (email && password) {

        message.textContent =
            "Login information received.";

    } else {

        message.textContent =
            "Please enter your email and password.";

    }
}

</script>

</body>
</html>
