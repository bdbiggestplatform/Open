<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel - BD Biggest Platform Ltd</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
}

.admin-header {
    background: #0b5ed7;
    color: white;
    padding: 20px;
    text-align: center;
}

.admin-header h1 {
    margin: 0;
    font-size: 26px;
}

.admin-header p {
    margin: 8px 0 0;
}
</style>
</head>

<body>

<header class="admin-header">
    <h1>BD Biggest Platform Ltd</h1>
    <p>Admin Panel</p>
</header>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxVmW-0fb3_WFAj3bCzy9W9PBr4IzhcCdJOcFYaxjnA3YUCO_sD4aLHSrYTScDIJqx5/exec";
</script>
    <script>

async function loadApplications() {

    try {

        const response = await fetch(API_URL);
        const data = await response.json();

        showApplications(data);

    } catch (error) {

        console.error("Error loading applications:", error);

    }

}

loadApplications();

    </script><script>

function displayApplications(data) {

    const container = document.getElementById("applications");

    if (!data || data.length === 0) {
        container.innerHTML += "<p>No applications found.</p>";
        return;
    }

    data.forEach(function(application) {

        const card = document.createElement("div");

        card.className = "application-card";

        card.innerHTML = `
            <p><strong>Application:</strong></p>
            <pre>${JSON.stringify(application, null, 2)}</pre>
        `;

        container.appendChild(card);

    });

}

    </script><style>

.application-card {
    background: white;
    padding: 15px;
    margin-top: 12px;
    border-radius: 10px;
    border: 1px solid #ddd;
}

.application-card pre {
    white-space: pre-wrap;
    word-break: break-word;
}

    </style><script>

function showApplications(data) {

    const container = document.getElementById("applications");

    container.innerHTML = `
        <h2>Applications</h2>
    `;

    displayApplications(data);
}

    </script>
    <script>

setInterval(function() {
    loadApplications();
}, 30000);

    </script><script>

const originalLoadApplications = loadApplications;

loadApplications = async function() {

    try {

        const response = await fetch(API_URL);
        const data = await response.json();

        showApplications(data);

    } catch (error) {

        console.error("Error loading applications:", error);

    }

};

loadApplications();

    </script><script>

const appBox = document.getElementById("applications");

appBox.style.minHeight = "200px";

    </script><script>

console.log("Admin Panel connected successfully.");

    </script>
</body>
</html>
<div class="admin-header">
    <h1>Admin Panel</h1>
    <p>BD Biggest Platform Ltd</p>
</div><div class="admin-menu">

    <button onclick="showSection('applications')">
        Applications
    </button>

    <button onclick="showSection('employees')">
        Employees
    </button>

    <button onclick="showSection('settings')">
        Settings
    </button>

</div><div id="applications" class="admin-section">
    <h2>Applications</h2>
    <p>Application data will appear here.</p>
</div><div id="employees" class="admin-section">
    <h2>Employees</h2>
    <p>Employee data will appear here.</p>
</div><div id="settings" class="admin-section">
    <h2>Settings</h2>
    <p>Admin settings will appear here.</p>
</div><script>

function showSection(sectionId) {

    const sections = document.querySelectorAll(".admin-section");

    sections.forEach(function(section) {
        section.style.display = "none";
    });

    document.getElementById(sectionId).style.display = "block";
}

showSection("applications");

</script><style>

.admin-menu {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin: 20px 0;
}

.admin-menu button {
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    background: #0d6efd;
    color: white;
    cursor: pointer;
}

.admin-section {
    padding: 20px;
    margin-top: 15px;
    background: white;
    border-radius: 10px;
}

</style><style>

.admin-header {
    text-align: center;
    padding: 20px;
}

.admin-header h1 {
    margin-bottom: 5px;
}

.admin-header p {
    margin: 0;
    color: #666;
}

</style><style>

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #f4f6f9;
}

</style><script>

document.querySelectorAll(".admin-menu button").forEach(function(button) {

    button.addEventListener("click", function() {
        window.scrollTo({
            top: document.querySelector(".admin-section[style*='block']").offsetTop,
            behavior: "smooth"
        });
    });

});

</script><footer style="text-align:center; padding:25px; margin-top:30px;">

</footer>
