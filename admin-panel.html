<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Admin Panel</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f1f5f9;
}

.login-box{
    width:92%;
    max-width:400px;
    margin:80px auto;
    padding:30px;
    background:white;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.12);
}

.login-box h1{
    text-align:center;
    color:#0d6efd;
}

.login-box p{
    text-align:center;
    color:#777;
}

.login-box input{
    width:100%;
    padding:13px;
    margin-top:12px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:16px;
}

.login-box button{
    width:100%;
    padding:13px;
    margin-top:15px;
    border:0;
    border-radius:8px;
    background:#0d6efd;
    color:white;
    font-size:16px;
}

#errorMessage{
    margin-top:12px;
    text-align:center;
    color:red;
}#adminPanel{
    display:none;
}

.admin-header{
    background:#0d6efd;
    color:white;
    padding:25px 15px;
    text-align:center;
}

.admin-header h1{
    margin:0 0 8px 0;
}

.admin-header p{
    margin:0;
}

.admin-menu{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    padding:15px;
    background:white;
}

.admin-menu button{
    flex:1;
    min-width:120px;
    padding:12px;
    border:0;
    border-radius:8px;
    background:#0d6efd;
    color:white;
    font-size:15px;
}

.admin-menu button:hover{
    background:#0958c7;
}

.logout-btn{
    background:#dc3545 !important;
}

.admin-section{
    display:none;
    padding:15px;
}

.admin-section.active{
    display:block;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:15px;
}

.card h2{
    margin-top:0;
    color:#0d6efd;
}
.application-card {
  background: white;
  padding: 18px;
  margin: 15px 0;
  border-radius: 12px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.10);
  border-left: 5px solid #0d6efd;
}

.application-card h3 {
  margin-top: 0;
  color: #0d6efd;
}

.application-card p {
  margin: 8px 0;
  line-height: 1.5;
}

.application-card a {
  color: #0d6efd;
  font-weight: bold;
  text-decoration: none;
}

.application-card a:hover {
  text-decoration: underline;
}
</style>
</head><body>

<div id="loginScreen">

    <div class="login-box">

        <h1>Admin Login</h1>

        <p>BD Biggest Platform Ltd</p>

        <input
            type="text"
            id="adminUsername"
            placeholder="Admin Username"
        >

        <input
            type="password"
            id="adminPassword"
            placeholder="Admin Password"
        >

        <button onclick="adminLogin()">
            Login
        </button>

        <div id="errorMessage"></div>

    </div>

</div>


<div id="adminPanel">

    <div class="admin-header">

        <h1>Admin Panel</h1>

        <p>BD Biggest Platform Ltd</p>

    </div>

    <div class="admin-menu">

        <button onclick="showSection('applications')">
            Applications
        </button>

        <button onclick="showSection('employees')">
            Employees
        </button>

        <button onclick="showSection('settings')">
            Settings
        </button>

        <button
            class="logout-btn"
            onclick="adminLogout()">
            Logout
        </button>

    </div>    
<div
  id="applications"
  class="admin-section active">

  <div class="card">

    <h2>Applications</h2>

    <div id="applicationList">
      Loading applications...
    </div>

  </div>

</div>

        <div id="applicationList">

            <div class="card">

                <h3>No Applications Yet</h3>

                <p>
                    Application data will be
                    connected from Google Sheets.
                </p>

            </div>

        </div>

    </div>


    <div
        id="employees"
        class="admin-section">

        <div class="card">

            <h2>Employees</h2>

            <p>
                Employee information
                will appear here.
            </p>

        </div>

    </div>    <div
        id="settings"
        class="admin-section">

        <div class="card">

            <h2>Settings</h2>

            <label>Company Name</label>

            <input
                type="text"
                id="companyName"
                value="BD Biggest Platform Ltd"
                style="
                width:100%;
                padding:12px;
                margin-top:8px;
                margin-bottom:15px;
                border:1px solid #ddd;
                border-radius:8px;
                "
            >

            <label>Contact Email</label>

            <input
                type="email"
                id="contactEmail"
                value="bangladeshbiggestplatform@gmail.com"
                style="
                width:100%;
                padding:12px;
                margin-top:8px;
                margin-bottom:15px;
                border:1px solid #ddd;
                border-radius:8px;
                "
            >

            <button
                onclick="saveSettings()"
                style="
                padding:12px 20px;
                border:0;
                border-radius:8px;
                background:#198754;
                color:white;
                "
            >
                Save Settings
            </button>

            <p id="saveMessage"></p>

        </div>

    </div>

</div>


<script>function adminLogin(){

    const username =
        document.getElementById("adminUsername").value;

    const password =
        document.getElementById("adminPassword").value;

    if(
        username === "admin" &&
        password === "123456"
    ){

        document.getElementById("loginScreen").style.display =
            "none";

        document.getElementById("adminPanel").style.display =
            "block";

    }else{

        document.getElementById("errorMessage").innerText =
            "Invalid username or password.";

    }

}


function adminLogout(){

    document.getElementById("adminPanel").style.display =
        "none";

    document.getElementById("loginScreen").style.display =
        "block";

}


function showSection(sectionId){

    const sections =
        document.querySelectorAll(".admin-section");

    sections.forEach(function(section){

        section.classList.remove("active");

    });

    document
        .getElementById(sectionId)
        .classList.add("active");

}function saveSettings(){

    const company =
        document.getElementById("companyName").value;

    const email =
        document.getElementById("contactEmail").value;

    localStorage.setItem(
        "companyName",
        company
    );

    localStorage.setItem(
        "contactEmail",
        email
    );

    document.getElementById("saveMessage").innerText =
        "Settings saved successfully.";

}


window.onload = function(){

    const company =
        localStorage.getItem("companyName");

    const email =
        localStorage.getItem("contactEmail");


    if(company){

        document.getElementById("companyName").value =
            company;

    }


    if(email){

        document.getElementById("contactEmail").value =
            email;

    }

};
const API_URL = "https://script.google.com/macros/s/AKfycbxVmW-0fb3_WFAj3bCzy9W9PBr4IzhcCdJOcFYaxjnA3YUCO_sD4aLHSrYTScDIJqx5/exec";

async function loadApplications() {

  try {

    const response = await fetch(API_URL);

    const result = await response.json();

    if (result.success) {

  const section = document.getElementById("applicationList");
  if (section) {

    let html = "<h2>Applications</h2>";

    result.applications.forEach(function(app, index) {

      html += `
        <div class="application-card">

          <h3>Application ${index + 1}</h3>

          <p><b>Name:</b> ${app.fullName}</p>
          <p><b>Address:</b> ${app.address}</p>
          <p><b>Date of Birth:</b> ${app.dateOfBirth}</p>
          <p><b>Phone:</b> ${app.phoneNumber}</p>
          <p><b>Education:</b> ${app.educationalQualification}</p>
          <p><b>Post:</b> ${app.post}</p>
          <p><b>Contact:</b> ${app.contactInformation}</p>
          <p><b>Marital Status:</b> ${app.maritalStatus}</p>

          <p>
            <b>Picture:</b>
            ${
              app.pictureUrl
              ? `<a href="${app.pictureUrl}" target="_blank">View Picture</a>`
              : "Not uploaded"
            }
          </p>

          <p>
            <b>CV:</b>
            ${
              app.cvUrl
              ? `<a href="${app.cvUrl}" target="_blank">View CV</a>`
              : "Not uploaded"
            }
          </p>

          <p><b>Submitted:</b> ${app.submittedAt}</p>

        </div>
      `;

    });

    section.innerHTML = html;

  }

} else 
{

      console.log("Failed to load applications");

    }

  } catch (error) {

    console.log("API Error:", error);

  }

}
loadApplications();
</script>

</body>
</html>
