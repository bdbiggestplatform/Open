<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Application Form - Bangladesh Biggest Platform</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    color: #222;
}

.header {
    background: #0b1f3a;
    color: white;
    text-align: center;
    padding: 25px 15px;
}

.header h1 {
    font-size: 28px;
}

.header p {
    margin-top: 8px;
    color: #dbe7f5;
}

.container {
    max-width: 800px;
    margin: 30px auto;
    padding: 20px;
}

.form-box {
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.form-box h2 {
    color: #0b1f3a;
    margin-bottom: 20px;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
    color: #333;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #d5dbe3;
    border-radius: 6px;
    font-size: 15px;
}

.form-group textarea {
    min-height: 120px;
    resize: vertical;
}
</style>
</head>

<body>

<header class="header">
    <h1>Application Form</h1>
    <p>Bangladesh Biggest Platform</p>
</header>

<div class="container">

<div class="form-box">
    <h2>Apply for a Position</h2><form id="applicationForm">

    <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="fullName" placeholder="Enter your full name" required>
    </div>

    <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="Enter your email address" required>
    </div>

    <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="phone" placeholder="Enter your phone number" required>
    </div>

    <div class="form-group">
        <label>Position</label>
        <input type="text" id="position" placeholder="Position you are applying for" readonly>
    </div>

    <div class="form-group">
        <label>Experience</label>
        <select id="experience" required>
            <option value="">Select experience</option>
            <option value="No Experience">No Experience</option>
            <option value="Less than 1 year">Less than 1 year</option>
            <option value="1-3 years">1-3 years</option>
            <option value="3+ years">3+ years</option>
        </select>
    </div>

    <div class="form-group">
        <label>Why do you want to join us?</label>
        <textarea id="message" placeholder="Write your answer..." required></textarea>
    </div><style>
.submit-button {
    width: 100%;
    padding: 13px;
    background: #0b1f3a;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 5px;
}

.submit-button:hover {
    background: #173d70;
}

.success-message {
    display: none;
    margin-top: 20px;
    padding: 15px;
    background: #e8f5e9;
    color: #2e7d32;
    border-radius: 7px;
    text-align: center;
    font-weight: bold;
}

@media (max-width: 600px) {
    .container {
        margin: 15px auto;
        padding: 12px;
    }

    .form-box {
        padding: 22px;
    }

    .header h1 {
        font-size: 23px;
    }
}
    </style></div>

</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const position = urlParams.get("position");

if (position) {
    document.getElementById("position").value = position;
}

document.getElementById("applicationForm").addEventListener("submit", function(event) {
    event.preventDefault();

    document.getElementById("successMessage").style.display = "block";

    document.getElementById("applicationForm").reset();

    if (position) {
        document.getElementById("position").value = position;
    }
});
</script>

</body>
</html>
