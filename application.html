<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Application</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7fb;
color:#222
}
header{
background:#0b5ed7;
color:white;
text-align:center;
padding:30px 15px
}
header h1{margin:0 0 8px}
.container{
max-width:900px;
margin:30px auto;
padding:15px
}.option-box{
background:white;
padding:25px;
margin-top:20px;
border-radius:12px;
text-align:center;
box-shadow:0 4px 15px #ddd
}
.option-box h2{
color:#123c69
}
.btn{
display:inline-block;
padding:12px 22px;
margin:8px;
border:0;
border-radius:7px;
color:white;
text-decoration:none;
font-weight:bold;
cursor:pointer;
background:#0b5ed7
}
.direct{
background:#198754
}#form{
background:white;
padding:25px;
margin-top:30px;
border-radius:12px;
}

#form label{
display:block;
margin-top:18px;
margin-bottom:7px;
font-weight:bold;
}

#form input,
#form select{
display:block;
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:7px;
font-size:15px;
}

#form .btn{
margin-top:25px;
}
</style>
</head>
<body>

<header>
<h1>Bangladesh Biggest Platform</h1>
<p>Application Portal</p>
</header>

<div class="container"><h2>Apply Now</h2>
<p>Choose your application method.</p>

<div class="option-box">
<h2>Google Form</h2>
<p>Apply using our official Google Form.</p>
<a class="btn" href="https://forms.gle/4ALKGsVbhxb226b97" target="_blank">
Apply with Google Form
</a>
</div>

<div class="option-box">
<h2>Direct Apply</h2>
<p>Apply directly through our website.</p>
<button class="btn direct" onclick="showForm()">
Direct Apply
</button>
</div><div id="form" style="display:none">

<h2>Direct Application Form</h2>

<label>Full Name *</label>
<input type="text" id="name" required>

<label>Address *</label>
<input type="text" id="address" required>

<label>Date of Birth *</label>
<input type="date" id="dob" required>

<label>Mobile Number *</label>
<input type="tel" id="mobile" required><label>Educational Qualification *</label>
<select id="education" required>
<option value="">Select</option>
<option>Under SSC</option>
<option>SSC</option>
<option>HSC</option>
<option>Hons</option>
<option>Masters</option>
<option>Diploma</option>
<option>Hons Running</option>
<option>Masters Running</option>
<option>Diploma Running</option>
</select>

<label>Marital Status *</label>
<select id="marital" required>
<option value="">Select</option>
<option>Single</option>
<option>Married</option>
<option>In a Relationship</option>
<option>Divorced</option>
<option>Widow</option>
</select><label>Post *</label>
<select id="post" required>
<option value="">Select</option>
<option>Massage Women</option>
<option>Recruitment Women</option>
<option>Story Writing (online)</option>
<option>Client Handling</option>
</select>

<label>Work Area *</label>
<input type="text" id="work" required>

<label>Contact Info *</label>
<select id="contact" required>
<option value="">Select</option>
<option>What's App</option>
<option>Imo</option>
<option>Gmail</option>
</select><label>WhatsApp / Imo / Gmail *</label>
<input type="text" id="contactInfo" required>

<label>Upload Your Picture *</label>
<input type="file" id="picture" accept="image/*" required>

<label>Upload Your CV</label>
<input type="file" id="cv" accept=".pdf,.doc,.docx">

<button type="button" class="btn direct" onclick="submitApplication()">
Submit Application
</button>

</div><script>
function showForm(){
document.getElementById("form").style.display="block";
window.scrollTo(0,500);
}

function submitApplication(){
let name=document.getElementById("name").value;

if(name==""){
alert("Please fill in all required fields.");
return;
}

alert("Application submitted successfully!");
}
</script>

</div>
</body>
</html>
