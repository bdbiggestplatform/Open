<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Application Form</title><style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #222;
}

.container {
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
    padding: 20px;
}</style>
</head>

<body>

<div class="container">

<h1>Application Form</h1>
<p>Please complete the form below.</p><div class="form-box">

<h2>Choose Application Method</h2>

<button type="button" onclick="showGoogleForm()">
Google Form
</button>

<button type="button" onclick="showDirectForm()">
Direct Form
</button>

</div><div id="googleForm" style="display:none;">
    <h2>Google Form</h2>

    <iframe
        src="https://docs.google.com/forms/d/e/4ALKGsVbhxb226b97/viewform?embedded=true"
        width="100%"
        height="900"
        frameborder="0"
        marginheight="0"
        marginwidth="0">
    </iframe>
</div><div id="directForm" style="display:none;">

<h2>Direct Application Form</h2>

<form>

<label>Full Name</label>
<input type="text" name="fullname" required>

<label>Email</label>
<input type="email" name="email" required>

<label>Phone Number</label>
<input type="tel" name="phone" required>

<label>Address</label>
<textarea name="address" rows="4"></textarea><label>Application Position</label>
<input type="text" name="position" placeholder="Enter your position" required>

<label>Why do you want to join us?</label>
<textarea name="reason" rows="5"></textarea>

<label>Tell us about yourself</label>
<textarea name="about" rows="5"></textarea><label>Upload CV</label>
<input type="file" name="cv">

<label>Additional Information</label>
<textarea name="additional" rows="5"></textarea>

<button type="submit">Submit Application</button>

</form>
</div></div>

<script>
function showGoogleForm() {
    document.getElementById("googleForm").style.display = "block";
    document.getElementById("directForm").style.display = "none";
}

function showDirectForm() {
    document.getElementById("directForm").style.display = "block";
    document.getElementById("googleForm").style.display = "none";
}
</script></div>

</body>
</html>
